name: Pull from Discourse

on:
  schedule:
    - cron: '17 3 * * *' # sync with discourse daily
  workflow_dispatch:
  workflow_call: # Run after every "Push to Discourse" so main always reflects the live state

permissions:
  contents: write

# A called workflow's concurrency applies too, so requesting discourse-sync
# here while the calling push run already holds it would self-deadlock. When
# called (the caller's event is a push), the caller's lock covers this run —
# use a per-run group; standalone schedule/dispatch runs take the real lock.
concurrency:
  group: ${{ github.event_name == 'push' && format('discourse-sync-called-{0}', github.run_id) || 'discourse-sync' }}
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    environment: "GitHub Actions CI"
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # History so the rebase retry below can find merge bases
        persist-credentials: true # needed in order to be able to push

    - name: Setup Julia
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
      with:
        version: '1'

    - name: Cache Julia packages
      uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

    - name: Instantiate DiscourseAdmin.jl
      uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

    - name: Fetch current state from Discourse
      run: julia --project=. -e 'using DiscourseAdmin; DiscourseAdmin.main_pull()'
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_USER: ${{ secrets.API_USER }}

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # Stage the admin/ tree (the mirror's sync scope)
        git add -A -- admin
        if git diff --staged --quiet; then
          echo "Repository already matches Discourse; nothing to commit"
        else
          git commit -m "Pull current state from Discourse"
          # Retry once on a non-fast-forward in case main moved during the run
          git push || { git pull --rebase origin main && git push; }
        fi
