name: Push to Discourse

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: discourse-sync
  cancel-in-progress: false

# The API key must only ever run alongside main's own (reviewed) code, so
# this workflow has no pull_request presence at all: a PR's diff *is* the
# preview of the API calls it will make, and CI tests the code.
jobs:
  push:
    runs-on: ubuntu-latest
    environment: "GitHub Actions CI"
    timeout-minutes: 20
    env:
      BEFORE_SHA: ${{ github.event.before }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Full history for range diffing
        persist-credentials: false

    - name: Setup Julia
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
      with:
        version: '1'

    - name: Cache Julia packages
      uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

    - name: Instantiate DiscourseAdmin.jl
      uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0

    - name: Ensure the prior state matches the current Discourse settings
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_USER: ${{ secrets.API_USER }}
      run: |
        # Resolve the pre-push ref once for this whole job (a push event with
        # no valid "before", e.g. a new branch, falls back to HEAD~1)
        git rev-parse -q --verify "$BEFORE_SHA^{commit}" >/dev/null 2>&1 || BEFORE_SHA=HEAD~1
        echo "BEFORE_SHA=$BEFORE_SHA" >> "$GITHUB_ENV"
        julia --project=. -e 'using DiscourseAdmin; DiscourseAdmin.main_pull()'
        git add -A -- admin
        # Only routes the prior state already tracks can meaningfully drift:
        # a route first introduced by this change has nothing to compare
        # against (the pull job mirrors its live entries afterwards)
        DIRS=$(git ls-tree -r --name-only "$BEFORE_SHA" -- admin |
               julia --project=. -e 'using DiscourseAdmin: entry_for; foreach(f -> println(entry_for(f)[1]), eachline())' |
               sort -u)
        if [ -n "$DIRS" ] && ! git diff --cached --quiet "$BEFORE_SHA" -- $DIRS; then
          git diff --cached --stat "$BEFORE_SHA" -- $DIRS
          echo "::error::The repository does not reflect the current Discourse state. The pull job will re-sync it automatically; then rebase and re-land this change."
          exit 1
        fi
        git reset -q --hard && git clean -qfd

    - name: Push changes to Discourse
      run: julia --project=. -e 'using DiscourseAdmin; DiscourseAdmin.main_push()'
      env:
        API_KEY: ${{ secrets.API_KEY }}
        API_USER: ${{ secrets.API_USER }}

  # Verify the changes landed
  pull:
    needs: push
    if: ${{ always() }}
    permissions:
      contents: write
    uses: ./.github/workflows/pull-from-discourse.yml
    secrets: inherit
